# Ganchos de commit (BE-087). Instalar uma vez: `pip install pre-commit && pre-commit install`.
# Rodar em tudo: `pre-commit run --all-files`. O CI repete as mesmas verificações.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3  # mesma versão de backend/requirements/dev.txt
    hooks:
      - id: ruff-check  # regras em backend/pyproject.toml (inclui S608: SQL por concatenação)
        args: [--fix]
        files: ^backend/
      - id: ruff-format  # o CI exige `ruff format --check .` (bloqueante desde a P-23)
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1  # mesma versão do CI; >= 8.25 para ler o .gitleaks.toml
    hooks:
      - id: gitleaks  # segredos no commit (P-16); exceções em .gitleaks.toml

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
