# nginx.conf da imagem do proxy do SAM (BE-089). Substitui o da imagem oficial para que
# o log de acesso seja só o JSON definido em conf.d/sam.conf (sem a linha "main").
user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    include /etc/nginx/conf.d/*.conf;
}
