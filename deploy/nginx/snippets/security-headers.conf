# Cabeçalhos de segurança das respostas servidas pelo próprio Nginx (frontend, estáticos
# e mídia). As respostas da API já trazem os mesmos cabeçalhos do Django
# (config/settings/prod.py, BE-085). Atenção: um `add_header` dentro de um location
# anula os herdados — por isso este arquivo é incluído em cada location.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Geolocalização só para o próprio site (botão "minha localização" do mapa, map.js).
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
