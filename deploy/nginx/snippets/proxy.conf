# Repasse para a API (Gunicorn). Incluído em /api/ e /admin/.
proxy_pass http://sam_api;
proxy_http_version 1.1;
proxy_set_header Connection "";

# Host original: o Django confere ALLOWED_HOSTS e monta URLs absolutas da mídia.
proxy_set_header Host $host;
# HTTPS terminado aqui: com USE_X_FORWARDED_PROTO=True o Django confia neste cabeçalho
# (sem ele, laço de redirecionamento com SECURE_SSL_REDIRECT).
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# REESCRITO (não anexado) com o IP de quem conectou: com SAM_NUM_PROXIES=1 o DRF usa
# este valor para limites de taxa, bloqueio de login e auditoria; um X-Forwarded-For
# forjado pelo cliente é descartado.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
# O mesmo id no log do Nginx e no log JSON do Django (RequestIDMiddleware).
proxy_set_header X-Request-ID $request_id;

proxy_connect_timeout 5s;
# Um pouco acima do timeout do Gunicorn (30 s): o erro que chega é o do Gunicorn.
proxy_read_timeout 35s;
proxy_send_timeout 35s;

# BREACH: respostas da API (com dados do usuário) não são comprimidas.
gzip off;
