# Content-Security-Policy do frontend (BE-089). Origens externas = as que as telas usam:
#   unpkg.com            Leaflet 1.9.4 (map.html, com SRI)
#   fonts.googleapis.com / fonts.gstatic.com   Google Fonts (todas as telas)
#   tile.openstreetmap.org                     tiles do mapa (map.js; OSM público, decidido no BE-094 — ADR 0022)
# 'unsafe-inline' só em style-src: os templates das telas usam atributos style="".
# Nenhum <script> inline nem handler on*= (conferido; o teste E2E com esta política
# reprova qualquer violação: backend/tests/e2e/test_same_origin_csp.py).
# Ao trocar o provedor de tiles (SAM.config.MAP_TILES), atualize img-src aqui. Os
# estabelecimentos do OpenStreetMap (Overpass) vêm pela própria API: connect-src 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://unpkg.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
